[package]
name = "mabel-os"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]
exclude = ["tapes"]

[dependencies]
mabel-media = { path = "crates/mabel-media" }
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2.191"
md5 = "0.8.1"
png = "0.18.1"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.30.2"
regex = "1.13.2"
reqwest = { version = "0.13.5", features = ["json", "form", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "net", "io-util", "fs"] }
toml = "1.2.1"
unicode-width = "0.2.3"
vt100 = "0.18.1"
zbus = { version = "6.3.0", default-features = false, features = ["service", "tokio"] }
