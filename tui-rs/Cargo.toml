[package]
name = "mabel-os"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json", "form", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.2.1"
