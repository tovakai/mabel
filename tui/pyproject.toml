[project]
name = "mabel-tui"
version = "0.1.0"
description = "Mabel in the terminal: COMMS, LIFE, AUDIO (cassette-futurist, amber phosphor)"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0",
    "textual-image>=0.8",
    "httpx>=0.27",
    "dbus-fast>=5.2.0",
    "pyyaml>=6.0.3",
    "pyte>=0.8.2",
    "numpy>=1.26",
    "sounddevice>=0.4",
]

[project.scripts]
mabel = "mabel_tui.app:main"
mabel-print = "mabel_tui.printserver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mabel_tui"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
